<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Entry</title>
    <link rel="icon" href="/image/sanctuary.ico" type="image/x-icon">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            line-height: 1.7;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #212529;
            min-height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header .bar {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
        }
        header a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        header a:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .container {
            max-width: 920px;
            margin: 32px auto;
            background: #fff;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #667eea;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        #status {
            color: #6c757d;
            margin: 0 0 24px;
            font-size: 14px;
            font-style: italic;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f3f5;
        }
        #content {
            white-space: normal;
            word-break: break-word;
        }
        #content p {
            margin: 0 0 1.4em;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 0.3px;
            color: #333;
        }
        #content pre {
            overflow-x: auto;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            margin: 1.5em 0;
        }
        #content code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 14px;
        }
        #content blockquote {
            border-left: 4px solid #667eea;
            margin: 1.5em 0;
            padding: 12px 20px;
            background: #f0f4ff;
            color: #495057;
            border-radius: 4px;
            font-style: italic;
        }
        #content h2,
        #content h3 {
            color: #667eea;
            margin: 1.8em 0 0.8em;
            font-weight: 700;
        }
        #content h2 {
            font-size: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        #content h3 {
            font-size: 18px;
        }
        #content a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 1px solid #667eea;
            transition: color 0.2s ease;
        }
        #content a:hover {
            color: #764ba2;
        }
        @media (max-width: 768px) {
            .container {
                margin: 16px;
                padding: 24px;
            }
            h1 {
                font-size: 28px;
            }
            #content p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <strong>My Diary</strong>
            <a href="/diary/">Back to list</a>
        </div>
    </header>

    <main class="container">
        <h1 id="title">Diary Entry</h1>
        <p id="status">Loading entry...</p>
        <article id="content"></article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        (function () {
            var titleEl = document.getElementById("title");
            var statusEl = document.getElementById("status");
            var contentEl = document.getElementById("content");

            function getRepoInfo() {
                var host = window.location.hostname || "";
                if (host.endsWith(".github.io")) {
                    var owner = host.split(".")[0];
                    return { owner: owner, repo: owner + ".github.io" };
                }

                return { owner: "vzhao2karry", repo: "vzhao2karry.github.io" };
            }

            function getEntryName() {
                var params = new URLSearchParams(window.location.search);
                return params.get("entry");
            }

            function isMarkdown(name) {
                return /\.md$/i.test(name || "");
            }

            function decodeBase64Utf8(base64Text) {
                var binary = atob(base64Text.replace(/\n/g, ""));
                var bytes = new Uint8Array(binary.length);
                var i;

                for (i = 0; i < binary.length; i += 1) {
                    bytes[i] = binary.charCodeAt(i);
                }

                if (window.TextDecoder) {
                    return new TextDecoder("utf-8").decode(bytes);
                }

                // Fallback for very old browsers.
                return decodeURIComponent(escape(binary));
            }

            function toHtml(rawText, entryName) {
                if (isMarkdown(entryName) && window.marked) {
                    return window.marked.parse(rawText || "");
                }

                var safe = (rawText || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
                return "<p>" + safe.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
            }

            function loadEntry() {
                var entryName = getEntryName();
                if (!entryName) {
                    statusEl.textContent = "Missing entry parameter. Example: ?entry=2026-04-28.md";
                    return;
                }

                titleEl.textContent = entryName.replace(/\.md$/i, "");

                var repoInfo = getRepoInfo();
                var apiUrl = "https://api.github.com/repos/" + repoInfo.owner + "/" + repoInfo.repo + "/contents/diary/" + encodeURIComponent(entryName);

                fetch(apiUrl)
                    .then(function (response) {
                        if (response.status === 404) {
                            throw new Error("not-found");
                        }
                        if (!response.ok) {
                            throw new Error("api-failed");
                        }
                        return response.json();
                    })
                    .then(function (payload) {
                        if (!payload.content) {
                            throw new Error("empty-content");
                        }

                        var text = decodeBase64Utf8(payload.content);
                        if (!text.trim()) {
                            statusEl.textContent = "This entry is currently empty.";
                            return;
                        }

                        contentEl.innerHTML = toHtml(text, entryName);
                        statusEl.textContent = "";
                    })
                    .catch(function (err) {
                        if (err.message === "not-found") {
                            statusEl.textContent = "Entry not found. Please check the file name in URL.";
                            return;
                        }
                        statusEl.textContent = "Unable to load this entry right now. Please try again later.";
                    });
            }

            loadEntry();
        })();
    </script>
</body>
</html>
