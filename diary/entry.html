<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Entry</title>
    <link rel="icon" href="/image/sanctuary.ico" type="image/x-icon">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            line-height: 1.7;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #212529;
            min-height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header .bar {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
        }
        header a {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }
        header a:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .container {
            max-width: 920px;
            margin: 32px auto;
            background: #fff;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #667eea;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        #status {
            color: #6c757d;
            margin: 0 0 24px;
            font-size: 14px;
            font-style: italic;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f3f5;
        }
        #content {
            white-space: normal;
            word-break: break-word;
        }
        #content p {
            margin: 0 0 1.4em;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 0.3px;
            color: #333;
        }
        #content pre {
            overflow-x: auto;
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            margin: 1.5em 0;
        }
        #content code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 14px;
        }
        #content blockquote {
            border-left: 4px solid #667eea;
            margin: 1.5em 0;
            padding: 12px 20px;
            background: #f0f4ff;
            color: #495057;
            border-radius: 4px;
            font-style: italic;
        }
        #content h2,
        #content h3 {
            color: #667eea;
            margin: 1.8em 0 0.8em;
            font-weight: 700;
        }
        #content h2 {
            font-size: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        #content h3 {
            font-size: 18px;
        }
        #content a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 1px solid #667eea;
            transition: color 0.2s ease;
        }
        #content a:hover {
            color: #764ba2;
        }
        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 {
            margin-top: 0;
            color: #667eea;
            margin-bottom: 20px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .modal-content input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        .modal-content textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            margin-top: 16px;
            display: none;
        }
        .modal-content textarea.show {
            display: block;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .btn-cancel {
            background: #e9ecef;
            color: #495057;
        }
        .btn-cancel:hover {
            background: #dee2e6;
        }
        .btn-download {
            background: #667eea;
            color: white;
        }
        @media (max-width: 768px) {
            .container {
                margin: 16px;
                padding: 24px;
            }
            h1 {
                font-size: 28px;
            }
            #content p {
                font-size: 15px;
            }
            .action-bar {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <strong>My Diary</strong>
            <a href="/diary/">Back to list</a>
        </div>
    </header>

    <main class="container">
        <h1 id="title">Diary Entry</h1>
        <p id="status">Loading entry...</p>
        <div class="action-bar">
            <button class="btn" id="downloadBtn">⬇ Download</button>
        </div>
        <article id="content"></article>
    </main>

    <!-- Download Modal -->
    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <h2>Download Entry</h2>
            <p>Select what to download:</p>
            <label>
                <input type="checkbox" id="includeTitle" checked> Include title
            </label>
            <label>
                <input type="checkbox" id="includeDate" checked> Include date
            </label>
            <label>
                <input type="checkbox" id="includeContent" checked> Include content
            </label>
            <textarea id="previewText" placeholder="Preview will appear here..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn btn-download" id="confirmDownloadBtn">Download as .md</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        (function () {
            var titleEl = document.getElementById("title");
            var statusEl = document.getElementById("status");
            var contentEl = document.getElementById("content");
            var downloadBtn = document.getElementById("downloadBtn");
            var downloadModal = document.getElementById("downloadModal");
            var cancelBtn = document.getElementById("cancelBtn");
            var confirmDownloadBtn = document.getElementById("confirmDownloadBtn");
            var includeTitleCheckbox = document.getElementById("includeTitle");
            var includeDateCheckbox = document.getElementById("includeDate");
            var includeContentCheckbox = document.getElementById("includeContent");
            var previewText = document.getElementById("previewText");

            var rawMarkdownText = ""; // Store raw markdown
            var entryFileName = "";

            function getRepoInfo() {
                var host = window.location.hostname || "";
                if (host.endsWith(".github.io")) {
                    var owner = host.split(".")[0];
                    return { owner: owner, repo: owner + ".github.io" };
                }

                return { owner: "vzhao2karry", repo: "vzhao2karry.github.io" };
            }

            function getEntryName() {
                var params = new URLSearchParams(window.location.search);
                return params.get("entry");
            }

            function isMarkdown(name) {
                return /\.md$/i.test(name || "");
            }

            function decodeBase64Utf8(base64Text) {
                var binary = atob(base64Text.replace(/\n/g, ""));
                var bytes = new Uint8Array(binary.length);
                var i;

                for (i = 0; i < binary.length; i += 1) {
                    bytes[i] = binary.charCodeAt(i);
                }

                if (window.TextDecoder) {
                    return new TextDecoder("utf-8").decode(bytes);
                }

                // Fallback for very old browsers.
                return decodeURIComponent(escape(binary));
            }

            function toHtml(rawText, entryName) {
                if (isMarkdown(entryName) && window.marked) {
                    return window.marked.parse(rawText || "");
                }

                var safe = (rawText || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
                return "<p>" + safe.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
            }

            function generateDownloadContent() {
                var content = "";

                if (includeTitleCheckbox.checked) {
                    content += "# " + titleEl.textContent + "\n\n";
                }

                if (includeDateCheckbox.checked) {
                    var today = new Date().toISOString().split("T")[0];
                    content += "**Date:** " + today + "\n\n";
                }

                if (includeContentCheckbox.checked) {
                    content += rawMarkdownText + "\n";
                }

                return content;
            }

            function updatePreview() {
                var preview = generateDownloadContent();
                previewText.classList.add("show");
                previewText.value = preview;
            }

            function downloadAsMarkdown() {
                var content = generateDownloadContent();
                var fileName = entryFileName.replace(/\.md$/i, "_export.md");
                
                // Create blob and download
                var blob = new Blob([content], { type: "text/markdown;charset=utf-8;" });
                var link = document.createElement("a");
                var url = URL.createObjectURL(blob);
                
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = "hidden";
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Close modal
                downloadModal.classList.remove("show");
            }

            function loadEntry() {
                var entryName = getEntryName();
                if (!entryName) {
                    statusEl.textContent = "Missing entry parameter. Example: ?entry=2026-04-28.md";
                    downloadBtn.disabled = true;
                    return;
                }

                entryFileName = entryName;
                titleEl.textContent = entryName.replace(/\.md$/i, "");

                var repoInfo = getRepoInfo();
                var apiUrl = "https://api.github.com/repos/" + repoInfo.owner + "/" + repoInfo.repo + "/contents/diary/" + encodeURIComponent(entryName);

                fetch(apiUrl)
                    .then(function (response) {
                        if (response.status === 404) {
                            throw new Error("not-found");
                        }
                        if (!response.ok) {
                            throw new Error("api-failed");
                        }
                        return response.json();
                    })
                    .then(function (payload) {
                        if (!payload.content) {
                            throw new Error("empty-content");
                        }

                        var text = decodeBase64Utf8(payload.content);
                        if (!text.trim()) {
                            statusEl.textContent = "This entry is currently empty.";
                            downloadBtn.disabled = true;
                            return;
                        }

                        rawMarkdownText = text;
                        contentEl.innerHTML = toHtml(text, entryName);
                        statusEl.textContent = "";
                        downloadBtn.disabled = false;
                    })
                    .catch(function (err) {
                        if (err.message === "not-found") {
                            statusEl.textContent = "Entry not found. Please check the file name in URL.";
                            return;
                        }
                        statusEl.textContent = "Unable to load this entry right now. Please try again later.";
                    });
            }

            // Event listeners
            downloadBtn.addEventListener("click", function () {
                updatePreview();
                downloadModal.classList.add("show");
            });

            cancelBtn.addEventListener("click", function () {
                downloadModal.classList.remove("show");
            });

            confirmDownloadBtn.addEventListener("click", function () {
                downloadAsMarkdown();
            });

            includeTitleCheckbox.addEventListener("change", updatePreview);
            includeDateCheckbox.addEventListener("change", updatePreview);
            includeContentCheckbox.addEventListener("change", updatePreview);

            // Close modal when clicking outside
            downloadModal.addEventListener("click", function (e) {
                if (e.target === downloadModal) {
                    downloadModal.classList.remove("show");
                }
            });

            loadEntry();
        })();
    </script>
</body>
</html>
